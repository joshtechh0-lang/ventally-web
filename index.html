<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ventally" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A platform for mental health support and conversations" />
    <title>Ventally</title>
    
    <!-- Preload critical assets for faster LCP -->
    <link rel="preload" href="/logo-192.png" as="image" />
    <link rel="preconnect" href="https://api.ventally.co" />
    <link rel="dns-prefetch" href="https://api.ventally.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="Ventally — Anonymous Mental Health Support" />
    <meta property="og:description" content="Sometimes the most honest conversations happen when no one knows your name." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  <!-- Accessibility: Focus styles -->
    <style>
      :focus-visible {
        outline: 2px solid var(--primary, #a78bfa);
        outline-offset: 2px;
        border-radius: 4px;
      }
      button, a, input, select, textarea {
        min-height: 44px;
      }
    </style>

    <!-- Refersion Affiliate / Referral Tracking
         Replace YOUR_REFERSION_PUBLIC_KEY with the key from your Refersion dashboard.
         This snippet initialises rfsn so trackCheckout() is available on conversion. -->
    <script>
      (function(r,e,f,s,i,o,n){
        r[i]=r[i]||function(){(r[i].q=r[i].q||[]).push(arguments)};
        o=e.createElement(f);o.async=1;o.src='https://cdn.refersion.com/refersion.js';
        n=e.getElementsByTagName(f)[0];n.parentNode.insertBefore(o,n);
      })(window,document,'script',null,'rfsn');
      rfsn('setKey','YOUR_REFERSION_PUBLIC_KEY');
      rfsn('readCookie');
    </script>

    <!-- Google AdSense
         Replace ca-pub-XXXXXXXXXXXXXXXX with your real publisher ID from adsense.google.com -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2329497752967659"
      crossorigin="anonymous"></script>

    <!-- Microsoft Clarity Analytics -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xfn3np7ej2");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
